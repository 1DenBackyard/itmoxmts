name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e '.[dev]'
      - run: ruff check .
      - run: pytest
      - run: python -m compileall app.py src
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify isolated web prototype
        run: |
          for file in prototypes/web-review/web/js/*.js; do node --check "$file"; done
          node --test tests/web-prototype.test.cjs
      - name: Verify production HTML frontend
        run: |
          node --check web/js/core.js
          node --check web/js/app.js
          node --test tests/web-production.test.cjs

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: net-specguard:ci

  deploy:
    name: Deploy production
    runs-on: ubuntu-latest
    needs: [test, docker]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    environment: production
    env:
      VM_HOST: 176.123.165.124
      VM_USER: denbackyard
      VM_APP_DIR: /home/denbackyard/net-specguard
      VM_SSH_PRIVATE_KEY_B64: ${{ secrets.VM_SSH_PRIVATE_KEY_B64 }}
      PROD_ENV_FILE: ${{ secrets.PROD_ENV_FILE }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate deployment secrets
        run: |
          test -n "$VM_SSH_PRIVATE_KEY_B64"
          test -n "$PROD_ENV_FILE"

      - name: Configure SSH
        run: |
          install -m 700 -d ~/.ssh
          printf '%s' "$VM_SSH_PRIVATE_KEY_B64" | base64 --decode > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keygen -y -f ~/.ssh/id_ed25519 > /dev/null
          cp ops/known_hosts ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Sync release from GitHub
        run: |
          ssh "$VM_USER@$VM_HOST" "mkdir -p '$VM_APP_DIR'"
          rsync -az --delete \
            --exclude='.env' \
            --exclude='.git/' \
            --exclude='data/' \
            ./ "$VM_USER@$VM_HOST:$VM_APP_DIR/"

      - name: Install production environment
        run: |
          printf '%s\n' "$PROD_ENV_FILE" > "$RUNNER_TEMP/production.env"
          chmod 600 "$RUNNER_TEMP/production.env"
          scp "$RUNNER_TEMP/production.env" "$VM_USER@$VM_HOST:$VM_APP_DIR/.env.next"
          ssh "$VM_USER@$VM_HOST" "chmod 600 '$VM_APP_DIR/.env.next'"
          ssh "$VM_USER@$VM_HOST" "mv '$VM_APP_DIR/.env.next' '$VM_APP_DIR/.env'"

      - name: Build and restart services
        run: |
          ssh "$VM_USER@$VM_HOST" \
            "sudo docker compose --project-name net-specguard --project-directory '$VM_APP_DIR' -f '$VM_APP_DIR/docker-compose.yml' up -d --build --remove-orphans"

      - name: Verify deployment
        run: |
          for attempt in {1..30}; do
            if ssh "$VM_USER@$VM_HOST" "curl --fail --silent http://127.0.0.1:8501/_stcore/health"; then
              echo "Deployment is healthy: $GITHUB_SHA"
              exit 0
            fi
            sleep 2
          done
          ssh "$VM_USER@$VM_HOST" \
            "sudo docker compose --project-name net-specguard --project-directory '$VM_APP_DIR' -f '$VM_APP_DIR/docker-compose.yml' logs --tail 100 app"
          exit 1

      - name: Verify public HTTPS
        run: |
          curl --fail --silent --show-error \
            --retry 12 --retry-delay 5 --retry-all-errors \
            https://aitalenthack.cloudru-edu.ru/_stcore/health
