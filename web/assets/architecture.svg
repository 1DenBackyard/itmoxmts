<text x="1224" y="396" class="b" style="fill:#e6eaf0">Правка «Было → Станет»</text>
<text x="1224" y="428" class="b" style="fill:#e6eaf0">Подтверждение человеком</text>
<text x="1224" y="464" class="s" style="fill:#bbc4d2">ИИ не меняет ТЗ автоматически</text>
