<text x="96" y="124" font-size="22" fill="#697386">NET SpecGuard · мультиагентное ревью и управляемые правки</text>
<text x="1450" y="88" font-size="22" font-weight="700" fill="#e40038">NET</text>
<rect x="48" y="168" width="1504" height="377" rx="24" fill="#f5f7fa"/>
<text x="72" y="200" class="s">КОНТУР ПРИЛОЖЕНИЯ · CLOUD.RU VM · DOCKER COMPOSE</text>
