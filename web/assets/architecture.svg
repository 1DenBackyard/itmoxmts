<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">NET SpecGuard — логическая архитектура</title>
<desc id="desc">Личный кабинет передаёт документ оркестратору. Четыре ревьюера работают параллельно, затем критик и судья проверяют замечания. Автор подтверждает правки и запускает новую проверку. Данные сохраняются в PostgreSQL и local или S3 storage. Внешние модели вызываются через шлюз с резервированием.</desc>
<defs>
 <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#8b93a2"/></marker>
 <marker id="red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#e40038"/></marker>
 <style>text{font-family:Arial,Helvetica,sans-serif;fill:#202632}.h{font-weight:700;font-size:24px}.b{font-size:20px;fill:#596273}.s{font-size:17px;fill:#697386}.label{font-size:16px;font-weight:700;letter-spacing:2px;fill:#e40038}.line{fill:none;stroke:#8b93a2;stroke-width:2;marker-end:url(#arrow)}.card{fill:white;stroke:#dce1e8;stroke-width:1.5}</style>
</defs>
<rect width="1600" height="900" fill="#fff"/>
<rect x="64" y="56" width="8" height="73" rx="4" fill="#e40038"/>
