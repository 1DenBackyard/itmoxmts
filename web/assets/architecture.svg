<text x="72" y="639" class="s">ДАННЫЕ И ОБЩИЕ СЕРВИСЫ</text>
<rect x="72" y="661" width="448" height="161" rx="16" class="card"/>
<text x="94" y="698" class="h">Хранение и история</text>
<text x="94" y="735" class="b">PostgreSQL · пользователи и ревью</text>
<text x="94" y="765" class="b">Сессии, задачи, решения и текст ТЗ</text>
<text x="94" y="797" class="s">Оригиналы: local / Cloud.ru Object Storage</text>
