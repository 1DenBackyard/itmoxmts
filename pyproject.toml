[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "net-specguard"
version = "0.1.0"
description = "Multi-agent technical specification reviewer"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "boto3>=1.35,<2",
  "openai>=1.60,<3",
  "pandas>=2.2,<3",
  "psycopg[binary]>=3.2,<4",
  "pydantic>=2.10,<3",
  "pypdf>=5,<7",
  "pdfplumber>=0.11,<0.12",
  "python-docx>=1.1,<2",
  "python-dotenv>=1.0,<2",
  "sqlalchemy>=2.0,<3",
  "streamlit>=1.40,<2",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1",
  "pytest>=8.3,<9",
  "ruff>=0.9,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
